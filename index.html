<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recepto</title>
</head>

<body>

<h1>Porozmawiaj z Recepto 🤖</h1>

<p>Twój cyfrowy recepcjonista jest dostępny 24/7.</p>

<h3>Wybierz usługę:</h3>

<button id="fizjo">Fizjoterapia</button>
<button id="masaz">Masaż</button>
<button id="konsultacja">Konsultacja</button>

<div id="wynik"></div>

<script>

document.getElementById("fizjo").onclick = function() {
  document.getElementById("wynik").innerHTML =
    "<h3>Wybrałeś Fizjoterapię ✅</h3>";
};

document.getElementById("masaz").onclick = function() {
  document.getElementById("wynik").innerHTML =
    "<h3>Wybrałeś Masaż ✅</h3>";
};

document.getElementById("konsultacja").onclick = function() {
  document.getElementById("wynik").innerHTML =
    "<h3>Wybrałeś Konsultację ✅</h3>";
};

</script>

</body>
</html>
