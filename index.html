<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recepto</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h1, h2 {
      margin-top: 0;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      cursor: pointer;
      margin: 5px;
      font-size: 15px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    .message {
      background: #eef4ff;
      padding: 15px;
      border-radius: 10px;
      margin: 15px 0;
    }

    .appointment {
      border: 1px solid #ddd;
      padding: 15px;
      border-radius: 10px;
      margin: 10px 0;
    }

    .hidden {
      display: none;
    }

    .small {
      color: #666;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="box">

    <h1>Porozmawiaj z Recepto</h1>

    <p>
      Twój cyfrowy recepcjonista jest dostępny 24/7.
    </p>

    <div class="message">
      Dzień dobry! 👋 Jestem Recepto.
      Mogę pomóc Ci umówić wizytę.
    </div>

    <h3>Wybierz usługę:</h3>

    <button onclick="chooseService('Fizjoterapia')">
      Fizjoterapia
    </button>

    <button onclick="chooseService('Masaż')">
      Masaż
    </button>

    <button onclick="chooseService('Konsultacja')">
      Konsultacja
    </button>

    <div id="booking" class="hidden">

      <h3>Wybierz termin:</h3>

      <button onclick="chooseTime('Poniedziałek 14:00')">
        Poniedziałek 14:00
      </button>

      <button onclick="chooseTime('Wtorek 10:30')">
        Wtorek 10:30
      </button>

      <button onclick="chooseTime('Środa 16:00')">
        Środa 16:00
      </button>

      <button onclick="chooseTime('Czwartek 12:00')">
        Czwartek 12:00
      </button>

    </div>

    <div id="form" class="hidden">

      <h3>Podaj dane:</h3>

      <input
        type="text"
        id="name"
        placeholder="Imię i nazwisko"
      >

      <input
        type="text"
        id="phone"
        placeholder="Numer telefonu"
      >

      <button onclick="makeAppointment()">
        Potwierdź wizytę
      </button>

    </div>

    <div id="confirmation" class="hidden"></div>

  </div>


  <div class="box">

    <button onclick="showOwnerPanel()">
      🔐 Panel właściciela
    </button>

  </div>


  <div class="box hidden" id="ownerPanel">

    <h2>Panel właściciela</h2>

    <p>
      <strong>Wszystkie rezerwacje:</strong>
      <span id="allCount">0</span>
    </p>

    <h3>Rezerwacje</h3>

    <div id="appointments">
      Ładowanie...
    </div>

  </div>

</div>


<script>

/* ===== SUPABASE ===== */

const SUPABASE_URL =
  "https://pgzsgqjdrgckaghcgrsz.supabase.co";

const SUPABASE_KEY =
 sb_publishable_B4AXgaTQmPAWhiewi2Ukwg_BzbdxgMs


/* ===== ZMIENNE ===== */

let selectedService = "";
let selectedTime = "";


/* ===== WYBÓR USŁUGI ===== */

function chooseService(service) {

  selectedService = service;

  document.getElementById("booking")
    .classList.remove("hidden");
}


/* ===== WYBÓR TERMINU ===== */

function chooseTime(time) {

  selectedTime = time;

  document.getElementById("form")
    .classList.remove("hidden");
}


/* ===== ZAPIS REZERWACJI ===== */

async function makeAppointment() {

  const name =
    document.getElementById("name").value.trim();

  const phone =
    document.getElementById("phone").value.trim();


  if (!name || !phone) {

    alert("Podaj imię i numer telefonu.");

    return;
  }


  try {

    const response = await fetch(
      SUPABASE_URL + "/rest/v1/appointments",
      {
        method: "POST",

        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY,
          "Content-Type": "application/json",
          "Prefer": "return=minimal"
        },

        body: JSON.stringify({
          service: selectedService,
          time: selectedTime,
          name: name,
          phone: phone
        })
      }
    );


    if (!response.ok) {

      console.error(await response.text());

      alert(
        "Nie udało się zapisać rezerwacji."
      );

      return;
    }


    document.getElementById("confirmation").innerHTML = `

      <div class="message">

        <h3>✅ Wizyta zarezerwowana!</h3>

        <p>
          <strong>Usługa:</strong>
          ${selectedService}
        </p>

        <p>
          <strong>Termin:</strong>
          ${selectedTime}
        </p>

        <p>
          <strong>Imię:</strong>
          ${name}
        </p>

        <p>
          <strong>Telefon:</strong>
          ${phone}
        </p>

      </div>

    `;


    document.getElementById("confirmation")
      .classList.remove("hidden");

    document.getElementById("form")
      .classList.add("hidden");

    document.getElementById("booking")
      .classList.add("hidden");

    document.getElementById("name").value = "";

    document.getElementById("phone").value = "";


  } catch (error) {

    console.error(error);

    alert(
      "Wystąpił błąd połączenia z bazą."
    );
  }
}


/* ===== PANEL WŁAŚCICIELA ===== */

function showOwnerPanel() {

  document.getElementById("ownerPanel")
    .classList.remove("hidden");

  loadAppointments();
}


/* ===== POBIERANIE REZERWACJI ===== */

async function loadAppointments() {

  const container =
    document.getElementById("appointments");

  container.innerHTML =
    "Ładowanie rezerwacji...";


  try {

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/appointments?select=*&order=created_at.desc",
      {
        method: "GET",

        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY
        }
      }
    );


    if (!response.ok) {

      console.error(await response.text());

      container.innerHTML =
        "<p>Nie udało się pobrać rezerwacji.</p>";

      return;
    }


    const appointments =
      await response.json();


    document.getElementById("allCount")
      .textContent = appointments.length;


    if (appointments.length === 0) {

      container.innerHTML =
        "<p>Brak rezerwacji.</p>";

      return;
    }


    container.innerHTML = "";


    appointments.forEach(function(appointment) {

      const div =
        document.createElement("div");

      div.className =
        "appointment";


      div.innerHTML = `

        <strong>${appointment.time}</strong>

        <br>

        ${appointment.name}

        <br>

        ${appointment.service}

        <br>

        📞 ${appointment.phone}

      `;


      container.appendChild(div);

    });


  } catch (error) {

    console.error(error);

    container.innerHTML =
      "<p>Wystąpił błąd podczas pobierania danych.</p>";
  }
}

</script>

</body>
</html>
