<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recepto — AI recepcjonista</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #111827;
        }

        header {
            background: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e5e7eb;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .status {
            color: #16a34a;
            font-size: 14px;
        }

        .container {
            max-width: 850px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            font-size: 42px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        .chat {
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .messages {
            min-height: 420px;
            padding: 25px;
        }

        .message {
            max-width: 80%;
            padding: 14px 17px;
            border-radius: 15px;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .bot {
            background: #f0f1ff;
        }

        .user {
            background: #5b5ce2;
            color: white;
            margin-left: auto;
        }

        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 10px 0 20px;
        }

        .option {
            background: white;
            border: 2px solid #5b5ce2;
            color: #5b5ce2;
            padding: 12px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
        }

        .option:hover {
            background: #5b5ce2;
            color: white;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 15px;
            border-top: 1px solid #e5e7eb;
        }

        input {
            flex: 1;
            padding: 15px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            font-size: 16px;
        }

        .send {
            background: #5b5ce2;
            color: white;
            border: none;
            padding: 0 25px;
            border-radius: 12px;
            cursor: pointer;
        }

        .confirmation {
            background: #ecfdf5;
            border: 1px solid #86efac;
            padding: 20px;
            border-radius: 14px;
            margin-top: 15px;
        }

        .confirmation h3 {
            color: #15803d;
            margin-bottom: 10px;
        }

    </style>
</head>

<body>

<header>

    <div class="logo">
        Recepto
    </div>

    <div class="status">
        ● Recepcjonista online
    </div>

</header>


<div class="container">

    <h1>
        Porozmawiaj z Recepto
    </h1>

    <p class="subtitle">
        Umów wizytę w kilka sekund.
    </p>


    <div class="chat">

        <div
            class="messages"
            id="messages"
        >

            <div class="message bot">

                Dzień dobry! 👋

                Jestem Recepto.

                Mogę pomóc Ci umówić wizytę.
                Co chcesz zrobić?

            </div>


            <div class="options">

                <button
                    class="option"
                    onclick="chooseService('Fizjoterapia')"
                >
                    Fizjoterapia
                </button>


                <button
                    class="option"
                    onclick="chooseService('Masaż')"
                >
                    Masaż
                </button>


                <button
                    class="option"
                    onclick="chooseService('Konsultacja')"
                >
                    Konsultacja
                </button>

            </div>

        </div>


        <div class="input-area">

            <input
                id="input"
                placeholder="Napisz wiadomość..."
            >

            <button
                class="send"
                onclick="sendMessage()"
            >
                Wyślij
            </button>

        </div>

    </div>

</div>


<script>

let selectedService = "";

let selectedTime = "";

let step = "service";


function addMessage(
    text,
    type
) {

    const messages =
        document.getElementById(
            "messages"
        );

    const message =
        document.createElement(
            "div"
        );

    message.className =
        "message " + type;

    message.innerText = text;

    messages.appendChild(
        message
    );

    messages.scrollTop =
        messages.scrollHeight;
}


function chooseService(service) {

    selectedService =
        service;

    addMessage(
        service,
        "user"
    );

    setTimeout(() => {

        addMessage(
            "Świetnie! 😊 Wybierz dogodny termin:",
            "bot"
        );

        showTimes();

    }, 500);
}


function showTimes() {

    const messages =
        document.getElementById(
            "messages"
        );

    const options =
        document.createElement(
            "div"
        );

    options.className =
        "options";

    const times = [
        "Poniedziałek 14:00",
        "Wtorek 10:30",
        "Środa 16:00",
        "Czwartek 12:00"
    ];

    times.forEach(
        time => {

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "option";

            button.innerText =
                time;

            button.onclick =
                () => chooseTime(
                    time
                );

            options.appendChild(
                button
            );

        }
    );

    messages.appendChild(
        options
    );

}


function chooseTime(time) {

    selectedTime =
        time;

    addMessage(
        time,
        "user"
    );

    setTimeout(() => {

        addMessage(
            "Super! 👍 Podaj proszę swoje imię.",
            "bot"
        );

        step = "name";

    }, 500);

}


function sendMessage() {

    const input =
        document.getElementById(
            "input"
        );

    const text =
        input.value.trim();

    if (!text) return;

    addMessage(
        text,
        "user"
    );

    input.value = "";

    if (step === "name") {

        window.userName =
            text;

        addMessage(
            "Dzięki! Teraz podaj numer telefonu.",
            "bot"
        );

        step = "phone";

        return;
    }


    if (step === "phone") {

        window.userPhone =
            text;

        setTimeout(() => {

            showConfirmation();

        }, 500);

        return;
    }


    addMessage(
        "Wybierz proszę jedną z dostępnych usług powyżej.",
        "bot"
    );

}


function showConfirmation() {

    const messages =
        document.getElementById(
            "messages"
        );

    const box =
        document.createElement(
            "div"
        );

    box.className =
        "confirmation";

    box.innerHTML = `

        <h3>
            ✅ Wizyta zarezerwowana!
        </h3>

        <p>
            <strong>Usługa:</strong>
            ${selectedService}
        </p>

        <p>
            <strong>Termin:</strong>
            ${selectedTime}
        </p>

        <p>
            <strong>Imię:</strong>
            ${window.userName}
        </p>

        <p>
            <strong>Telefon:</strong>
            ${window.userPhone}
        </p>

        <br>

        <p>
            To jest wersja demonstracyjna.
            W prawdziwej wersji Recepto
            rezerwacja zostanie zapisana
            w systemie gabinetu.
        </p>

    `;

    messages.appendChild(
        box
    );

    messages.scrollTop =
        messages.scrollHeight;

}

</script>

</body>
</html>
